<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:dark}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style><title>Jet Paket Burger</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600&display=swap">
<style id="css">
/* Layout: kırmızı hız çizgili hero + sarı etiketli bölüm başlıkları, bordo fiyat kutuları, alt sepet çubuğu. Tek koyu görünüm. */
:root {
  --ink: #0a0606;
  --panel: #170a0b;
  --wine: #560a0e;
  --wine-hi: #70101a;
  --red: #d9181e;
  --red-hot: #ff3b30;
  --gold: #ffc21a;
  --paper: #fff6ee;
  --muted: #c9aaa5;
  --line: #3a1a1c;
  --wa: #25d366;
  --f-display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --f-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-util: "Barlow Condensed", "Arial Narrow", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--ink); color: var(--paper);
  font-family: var(--f-body); font-size: 16px; line-height: 1.45;
  margin: 0; padding-bottom: 7rem;
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.wrap { max-width: 44rem; margin-inline: auto; padding-inline: 16px; }
svg { display: block; }

/* Üst çubuk */
.top { background: var(--ink); padding-block: 0.8rem; }
.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; }
.mark { display: inline-flex; flex-direction: column; line-height: 0.85; transform: skewX(-9deg); text-transform: uppercase; font-family: var(--f-display); font-weight: 900; }
.mark .j { font-size: 1.55rem; color: #fff; letter-spacing: 0.02em; }
.mark .p { font-size: 1.55rem; color: var(--gold); letter-spacing: 0.02em; }
.mark .b { font-size: 0.62rem; letter-spacing: 0.5em; color: #fff; font-family: var(--f-util); font-weight: 600; }
.mark .jp { display: flex; gap: 0.3rem; align-items: baseline; }
.bag { position: relative; width: 2.8rem; height: 2.8rem; display: grid; place-items: center; background: transparent; border: 0; color: var(--gold); }
.bag svg { width: 1.6rem; height: 1.6rem; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.bag .n { position: absolute; top: 0.15rem; right: 0.05rem; min-width: 1.2rem; height: 1.2rem; padding: 0 0.25rem; display: grid; place-items: center; background: var(--red); color: #fff; border-radius: 99px; font-family: var(--f-display); font-weight: 900; font-size: 0.85rem; }

/* Yönetici şeridi */
.admin { background: #241214; border-bottom: 1px solid var(--line); padding-block: 0.6rem; }
.admin .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 0.6rem 1rem; }
.admin p { margin: 0; color: var(--muted); font-size: 0.9rem; flex: 1 1 14rem; min-width: 0; }
.admin .row { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }
.admin label { font-family: var(--f-util); letter-spacing: 0.08em; text-transform: uppercase; font-size: 0.9rem; color: var(--muted); }
.admin input[type="text"] { background: var(--ink); border: 1px solid var(--line); padding: 0.45rem 0.6rem; min-height: 2.5rem; width: 11rem; max-width: 100%; }
.sm {
  min-height: 2.5rem; padding: 0.4rem 1rem; border: 1px solid var(--gold); background: transparent; color: var(--gold);
  font-family: var(--f-util); font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase; font-size: 0.95rem;
}
.sm.solid { background: var(--gold); color: #1a0d00; }
.msg { flex-basis: 100%; margin: 0; font-size: 0.9rem; color: var(--gold); }

/* Hero */
.hero { padding-top: 0.3rem; }
.hero-frame { position: relative; border-radius: 18px; overflow: hidden; border: 1px solid var(--line); background: #5a0709; }
.hero-img { display: block; width: 100%; aspect-ratio: 16 / 10; object-fit: cover; object-position: 50% 60%; }
.hero-frame::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgba(10,6,6,0.55), transparent 45%); pointer-events: none; }
.slogan { margin: 1.1rem 0 0; font-family: var(--f-display); font-weight: 900; font-size: clamp(2rem, 9.5vw, 3.2rem); line-height: 1; letter-spacing: 0.005em; color: #fff; }
.slogan span { color: var(--red-hot); }
.feats { display: flex; flex-wrap: wrap; gap: 0.4rem 1.2rem; margin: 0.7rem 0 0; padding: 0; list-style: none; }
.feats li { display: flex; align-items: center; gap: 0.4rem; font-family: var(--f-util); font-weight: 600; font-size: 1rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.feats svg { width: 1.3rem; height: 1.3rem; fill: none; stroke: var(--gold); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* Kategori çubuğu */
.cats { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--ink); margin-top: 1rem; border-bottom: 1px solid var(--line); }
.cats-row { display: flex; gap: 0.5rem; overflow-x: auto; padding-block: 0.7rem; scrollbar-width: none; }
.cats-row::-webkit-scrollbar { display: none; }
.chip {
  flex: none; background: var(--panel); border: 1px solid var(--line); color: var(--muted); min-height: 2.4rem; padding: 0.4rem 1rem; border-radius: 99px;
  font-family: var(--f-util); font-weight: 600; font-size: 1rem; letter-spacing: 0.08em; text-transform: uppercase;
}
.chip[aria-pressed="true"] { background: var(--red); border-color: var(--red); color: #fff; }

/* Bölümler */
.section { padding-top: 1.6rem; scroll-margin-top: 4.5rem; }
.section h2 { margin: 0 0 0.9rem; font-family: var(--f-display); font-weight: 900; text-transform: uppercase; font-size: 1.7rem; letter-spacing: 0.03em; line-height: 1.05; color: #fff; display: flex; align-items: center; gap: 0.6rem; }
.section h2::before { content: ""; width: 0.28rem; height: 1.5rem; background: var(--red); border-radius: 2px; }

/* Ürün kartları: iki sütun */
.grid { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.75rem; }
.pc { display: flex; flex-direction: column; gap: 0.35rem; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 0.55rem 0.55rem 0.65rem; min-width: 0; }
.pc .ph { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 12px; background: #0e0707; }
.pc.dk .ph { aspect-ratio: 1 / 1; width: 64%; align-self: center; object-fit: cover; background: #f3ece6; }
.pc h3 { margin: 0.25rem 0 0; padding-inline: 0.2rem; font-family: var(--f-body); font-weight: 600; font-size: 1.02rem; line-height: 1.2; color: #fff; }
.pc .ds { margin: 0; padding-inline: 0.2rem; color: var(--muted); font-size: 0.8rem; line-height: 1.3; }
.inc { margin: 0.1rem 0.2rem 0; display: block; align-self: flex-start; font-family: var(--f-util); font-weight: 600; font-size: 0.8rem; letter-spacing: 0.04em; text-transform: uppercase; color: var(--gold); background: rgba(255, 194, 26, 0.12); border: 1px solid rgba(255, 194, 26, 0.5); border-radius: 10px; padding: 0.2rem 0.6rem; line-height: 1.25; }
.pr { margin: auto 0 0; padding: 0.15rem 0.2rem 0.1rem; font-family: var(--f-body); font-weight: 700; font-size: 1.5rem; line-height: 1.1; color: var(--gold); font-variant-numeric: tabular-nums; }
.add {
  position: relative; display: flex; align-items: center; justify-content: center; gap: 0.3rem; width: 100%; min-height: 2.8rem; border: 0; border-radius: 10px;
  background: var(--red); color: #fff; font-family: var(--f-body); font-weight: 600; font-size: 1rem;
}
.add:active { background: #b3141a; }
.add.on { background: #8f1015; box-shadow: inset 0 0 0 2px var(--gold); }
.q {
  position: absolute; top: -0.5rem; right: -0.3rem; min-width: 1.5rem; height: 1.5rem; padding: 0 0.3rem; display: grid; place-items: center;
  background: var(--gold); color: #1a0d00; border-radius: 99px; font-family: var(--f-display); font-weight: 900; font-size: 1rem;
}
.edp { display: flex; align-items: center; justify-content: center; gap: 0.3rem; min-height: 2.8rem; background: var(--wine); border: 1px solid var(--gold); border-radius: 10px; }
.edp input {
  width: 5rem; background: var(--ink); border: 1px solid var(--gold); border-radius: 6px; padding: 0.25rem 0.3rem; text-align: center;
  font-family: var(--f-display); font-weight: 900; font-size: 1.4rem; min-height: 2.4rem;
}
.edp input.bad { border-color: var(--red-hot); background: #3a0b0b; }

.foot { padding-block: 2.4rem 1rem; display: grid; gap: 0.7rem; }
.hat { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 0.8rem 1rem; }
.hat small { display: block; font-family: var(--f-util); font-weight: 600; text-transform: uppercase; font-size: 0.95rem; letter-spacing: 0.1em; color: var(--muted); }
.hat b { font-family: var(--f-display); font-weight: 900; font-size: clamp(2rem, 10vw, 2.9rem); line-height: 1; letter-spacing: 0.02em; color: var(--gold); user-select: all; }
.afiyet { font-family: var(--f-display); font-weight: 800; font-size: 1.8rem; color: var(--gold); margin: 0; }
.fine { color: var(--muted); font-size: 0.85rem; margin: 0; }

/* Sepet çubuğu */
.bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; padding: 0 12px calc(0.6rem + env(safe-area-inset-bottom, 0px)); background: linear-gradient(to top, var(--ink) 55%, transparent); }
.bar-in { max-width: 44rem; margin-inline: auto; display: flex; align-items: center; gap: 0.7rem; background: #1b1112; border: 1px solid var(--line); border-radius: 16px; padding: 0.6rem 0.6rem 0.6rem 1rem; box-shadow: 0 6px 24px rgba(0,0,0,0.6); }
.bar-sum { flex: 1 1 auto; min-width: 0; background: transparent; border: 0; padding: 0; text-align: left; color: #fff; }
.bar-sum small { display: block; font-family: var(--f-util); font-weight: 600; font-size: 0.9rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--gold); white-space: nowrap; }
.bar-sum b { display: block; font-family: var(--f-body); font-weight: 600; font-size: 1.55rem; line-height: 1.15; font-variant-numeric: tabular-nums; }
.bar-wa { flex: none; display: inline-flex; align-items: center; gap: 0.45rem; min-height: 3.2rem; padding: 0.6rem 1.1rem; border: 0; border-radius: 12px; background: var(--wa); color: #06210f; font-family: var(--f-body); font-weight: 700; font-size: 1.05rem; white-space: nowrap; }
.bar-wa svg { width: 1.35rem; height: 1.35rem; fill: currentColor; }

/* Sipariş özeti */
.sheet-back { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,0.75); display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 44rem; max-height: 90%; overflow-y: auto; background: var(--panel); border-top: 4px solid var(--gold); border-radius: 18px 18px 0 0; padding: 1.1rem 16px calc(1.1rem + env(safe-area-inset-bottom, 0px)); }
.sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
.sheet h2 { margin: 0; font-family: var(--f-display); font-weight: 900; text-transform: uppercase; font-size: 1.9rem; }
.x { background: transparent; border: 1px solid var(--line); border-radius: 10px; width: 2.6rem; height: 2.6rem; font-size: 1.1rem; }
.lines { list-style: none; margin: 0.9rem 0 0; padding: 0; }
.lines li { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: 0.7rem; padding-block: 0.6rem; border-bottom: 1px dashed var(--line); }
.lines .t { font-variant-numeric: tabular-nums; white-space: nowrap; min-width: 4rem; text-align: right; }
.stp { display: inline-flex; border: 1px solid var(--gold); border-radius: 8px; overflow: hidden; }
.stp button { width: 2.4rem; min-height: 2.4rem; background: transparent; border: 0; font-size: 1.25rem; line-height: 1; }
.stp output { min-width: 2rem; display: grid; place-items: center; background: var(--gold); color: #1a0d00; font-family: var(--f-display); font-weight: 900; font-size: 1.15rem; }
.total { display: flex; justify-content: space-between; margin: 0.9rem 0; font-family: var(--f-display); font-weight: 900; font-size: 1.8rem; text-transform: uppercase; }
.field { display: grid; gap: 0.3rem; margin-bottom: 0.9rem; }
.field label { font-family: var(--f-util); letter-spacing: 0.08em; text-transform: uppercase; font-size: 0.9rem; color: var(--muted); }
.field textarea { background: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 0.6rem 0.7rem; min-height: 4.5rem; resize: vertical; width: 100%; }
.acts { display: flex; flex-wrap: wrap; gap: 0.6rem; }
.btn {
  flex: 1 1 11rem; display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; min-height: 3.1rem; padding: 0.6rem 1rem; text-decoration: none; text-align: center;
  border: 1px solid var(--line); border-radius: 12px; background: transparent; color: var(--paper);
  font-family: var(--f-util); font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase; font-size: 1.02rem;
}
.btn.wa { background: var(--wa); border-color: var(--wa); color: #06210f; }
.btn svg { flex: none; width: 1.3rem; height: 1.3rem; fill: currentColor; }
.btn { letter-spacing: 0.05em; }
.note { color: var(--muted); font-size: 0.85rem; margin: 0.8rem 0 0; }
</style>

  '<div class="admin" id="admin" hidden><div class="wrap" id="adminIn"></div></div>' +
  '<section class="hero"><div class="wrap">' +
    '<div class="hero-frame"><img class="hero-img" src="' + IMG.hero + '" alt="Peynirli Jet Burger ve patates"></div>' +
    '<h1 class="slogan">Lezzet <span>hızla kapında!</span></h1>' +
    '<ul class="feats">' +
      '<li><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>Adrese teslim</li>' +
      '<li><svg viewBox="0 0 24 24"><circle cx="12" cy="14" r="7"/><path d="M12 14V10M9 3h6M12 3v4M19 6l-1.5 1.5"/></svg>Hızlı servis</li>' +
    '</ul>' +
  '</div></section>' +
  '<nav class="cats" aria-label="Menü kategorileri"><div class="wrap"><div class="cats-row" id="cats"></div></div></nav>' +
  '<main class="wrap" id="menu"></main>' +
  '<footer class="wrap foot">' +
    '<div class="hat"><small>Sipariş hattı</small><b id="phoneShow"></b></div>' +
    '<p class="afiyet">Afiyet olsun!</p>' +
    '<p class="fine">Fiyatlar TL cinsindendir. Ürün görselleri temsilidir. Alerjen bilgisi için siparişte belirtin.</p>' +
  '</footer>' +
  '<div class="bar" id="bar" hidden><div class="bar-in"><button class="bar-sum" id="openSheet" type="button"><small id="barCount"></small><b id="barTotal"></b></button><button class="bar-wa" id="openSheet2" type="button">' + WA_SVG + 'Sipariş Ver</button></div></div>' +
  '<div class="sheet-back" id="sheetBack" hidden><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">' +
    '<div class="sheet-head"><h2 id="sheetTitle">Siparişin</h2><button class="x" id="closeSheet" type="button" aria-label="Kapat">✕</button></div>' +
    '<ul class="lines" id="lines"></ul>' +
    '<div class="total"><span>Toplam</span><span id="sheetTotal"></span></div>' +
    '<div class="field"><label for="addr">Adres ve notun</label><textarea id="addr" placeholder="Mahalle, sokak, kapı no, varsa sipariş notu"></textarea></div>' +
    '<div class="acts"><a class="btn wa" id="waOrder" target="_blank" rel="noopener">' + WA_SVG + 'WhatsApp ile sipariş ver</a>' +
    '<button class="btn" id="clear" type="button">Sepeti boşalt</button></div>' +
    '<p class="note">WhatsApp mesaj taslağı olarak açılır. Siparişin işleme alınması için mesajı göndermen gerekir.</p>' +
  '</div></div>';

function $(id) { return document.getElementById(id); }
function tl(n) { return n.toLocaleString("tr-TR") + " ₺"; }
function fmtPhone(d) {
  var s = String(d || "");
  if (s.indexOf("90") === 0 && s.length === 12) { s = "0" + s.slice(2); }
  if (s.length === 11) { return s.slice(0, 4) + " " + s.slice(4, 7) + " " + s.slice(7, 9) + " " + s.slice(9); }
  return s;
}
function normPhone(v) {
  var d = String(v || "").replace(/\D/g, "");
  if (d.length === 11 && d.charAt(0) === "0") { return "90" + d.slice(1); }
  if (d.length === 10 && d.charAt(0) === "5") { return "90" + d; }
  if (d.length === 12 && d.indexOf("90") === 0) { return d; }
  return "";
}
function parts(k) { var s = k.split("|"); return { id: s[0], o: s.length > 1 ? +s[1] : -1 }; }
function priceOf(k) { var p = parts(k), v = STATE.p[p.id]; return p.o >= 0 ? v[p.o] : v; }
function labelOf(k) { var p = parts(k), n = ITEM[p.id].name; return p.o >= 0 ? n + " (" + OPT[p.o] + ")" : n; }
function waBase() { return "https://wa.me/" + STATE.phone; }

var cart = {};
var editing = false;
var canEdit = false;

function tile(key) {
  if (editing) {
    var pid = "pe-" + key.replace("|", "-");
    return '<label class="edp" for="' + pid + '"><input id="' + pid + '" type="number" inputmode="numeric" min="0" step="1" value="' + priceOf(key) + '" data-p="' + key + '"><i>₺</i></label>';
  }
  var q = cart[key] || 0;
  return '<button type="button" class="add' + (q ? " on" : "") + '" data-add="' + key + '" aria-label="' + labelOf(key) + ' ' + priceOf(key) + ' lira, sepete ekle">+ Sepete Ekle' + (q ? '<span class="q">' + q + '</span>' : "") + '</button>';
}
function price(key) { return editing ? "" : '<p class="pr">' + priceOf(key) + ' ₺</p>'; }

function renderMenu() {
  var html = "";
  GROUPS.forEach(function (g) {
    html += '<section class="section" id="sec-' + g.id + '"><h2>' + g.name + '</h2><ul class="grid">';
    g.items.forEach(function (it) {
      if (g.kind === "burger") {
        var k = it.id + "|1";
        html += '<li class="pc"><img class="ph" src="' + IMG[it.id] + '" alt="' + it.name + '"><h3>' + it.name + ' Menü</h3><p class="ds">' + it.desc + '</p>' +
          '<span class="inc">Burger + Patates + İçecek</span>' + price(k) + tile(k) + '</li>';
      } else {
        html += '<li class="pc' + (g.kind === "drink" ? " dk" : "") + '"><img class="ph" src="' + IMG[it.id] + '" alt="' + it.name + '"><h3>' + it.name + '</h3>' + price(it.id) + tile(it.id) + '</li>';
      }
    });
    html += '</ul></section>';
  });
  $("menu").innerHTML = html;
}

function renderCats() {
  $("cats").innerHTML = GROUPS.map(function (g, k) {
    return '<button type="button" class="chip" data-cat="' + g.id + '" aria-pressed="' + (k === 0) + '">' + g.name + '</button>';
  }).join("");
}

function totals() {
  var n = 0, t = 0;
  Object.keys(cart).forEach(function (k) { n += cart[k]; t += cart[k] * priceOf(k); });
  return { n: n, t: t };
}

function orderText() {
  var s = totals();
  var lines = Object.keys(cart).map(function (k) { return "- " + cart[k] + " x " + labelOf(k) + " = " + tl(cart[k] * priceOf(k)); });
  var a = ($("addr") && $("addr").value || "").trim();
  return "Merhaba, Jet Paket Burger'dan sipariş vermek istiyorum:\n" + lines.join("\n") + "\nToplam: " + tl(s.t) + (a ? "\nAdres / not: " + a : "");
}

function renderCart() {
  var s = totals();
  $("bar").hidden = editing || s.n === 0;
  $("barCount").textContent = "Sepetim · " + s.n + " ürün";
  $("barTotal").textContent = tl(s.t) + " ›";
  $("bagN").textContent = s.n; $("bagN").hidden = s.n === 0;
  $("sheetTotal").textContent = tl(s.t);
  $("lines").innerHTML = Object.keys(cart).map(function (k) {
    return '<li><span>' + labelOf(k) + '</span><span class="stp"><button type="button" data-dec="' + k + '" aria-label="Azalt">−</button><output>' + cart[k] +
      '</output><button type="button" data-inc="' + k + '" aria-label="Arttır">+</button></span><span class="t">' + tl(cart[k] * priceOf(k)) + '</span></li>';
  }).join("");
  $("waOrder").href = waBase() + "?text=" + encodeURIComponent(orderText());
  if (s.n === 0) { $("sheetBack").hidden = true; }
}

function badge(k) {
  var b = document.querySelector('[data-add="' + k + '"]');
  if (!b) { return; }
  var old = b.querySelector(".q");
  if (old) { old.remove(); }
  var q = cart[k] || 0;
  b.classList.toggle("on", q > 0);
  if (q) { var sp = document.createElement("span"); sp.className = "q"; sp.textContent = q; b.appendChild(sp); }
}

function change(k, d) {
  cart[k] = (cart[k] || 0) + d;
  if (cart[k] <= 0) { delete cart[k]; }
  badge(k);
  renderCart();
}

function renderContacts() {
  $("phoneShow").textContent = fmtPhone(STATE.phone);
}

/* Yönetici: fiyat düzenleme */
function renderAdmin() {
  var box = $("adminIn");
  if (!editing) {
    box.innerHTML = '<p>Yönetici görünümü. Fiyatları ve WhatsApp numarasını buradan değiştirebilirsin.</p><button type="button" class="sm" id="editStart">Fiyatları düzenle</button>';
  } else {
    box.innerHTML = '<p>Fiyatları düzenliyorsun. Kutulara yeni fiyatları yaz, sonra Kaydet\'e bas.</p>' +
      '<div class="row"><label for="phEdit">WhatsApp numarası</label><input type="text" id="phEdit" inputmode="tel" value="' + fmtPhone(STATE.phone) + '"></div>' +
      '<div class="row"><button type="button" class="sm solid" id="editSave">Kaydet</button><button type="button" class="sm" id="editCancel">Vazgeç</button></div>' +
      '<p class="msg" id="adminMsg" aria-live="polite"></p>';
  }
  $("admin").hidden = !canEdit;
}

function adminMsg(t) { var m = $("adminMsg"); if (m) { m.textContent = t; } }

function startEdit() { editing = true; $("sheetBack").hidden = true; renderAdmin(); renderMenu(); renderCart(); }
function cancelEdit() { editing = false; renderAdmin(); renderMenu(); renderCart(); }

function safeJSON(o) { return JSON.stringify(o).replace(/</g, "\\u003c"); }

function buildDoc(state) {
  var reset = FALLBACK_RESET;
  var heads = document.head ? document.head.querySelectorAll("style") : [];
  for (var i = 0; i < heads.length; i++) { if (heads[i].textContent.indexOf("color-scheme") > -1) { reset = heads[i].textContent; break; } }
  var css = $("css").textContent;
  var app = $("app").textContent.replace(/^var STATE = [\s\S]*?;\n\/\*@@END_STATE\*\//, function () {
    return "var STATE = " + safeJSON(state) + ";\n/*@@END_STATE*/";
  });
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + reset + '</style></head><body>' +
    TITLE_HTML + '<style id="css">' + css + '</style><div id="root"></div><script id="app">' + app + '<\/script></body></html>';
}

function saveEdit() {
  var np = JSON.parse(JSON.stringify(STATE.p));
  var bad = false;
  document.querySelectorAll("[data-p]").forEach(function (inp) {
    var v = parseInt(inp.value, 10);
    var ok = !isNaN(v) && v >= 0 && v < 100000;
    inp.classList.toggle("bad", !ok);
    if (!ok) { bad = true; return; }
    var s = inp.getAttribute("data-p").split("|");
    if (s.length > 1) { np[s[0]][+s[1]] = v; } else { np[s[0]] = v; }
  });
  if (bad) { adminMsg("Kırmızı kutulara 0 veya daha büyük bir tam sayı yaz."); return; }
  var phone = normPhone($("phEdit").value);
  if (!phone) { adminMsg("WhatsApp numarasını 0553 903 54 04 biçiminde yaz."); return; }
  var html = buildDoc({ phone: phone, p: np });
  adminMsg("Kaydediliyor…");
  var use = window.claude && window.claude.use ? window.claude.use("artifact") : Promise.resolve(null);
  use.then(function (a) {
    if (!a) { throw { code: "not_granted" }; }
    return a.publish(html);
  }).catch(function (e) {
    var c = e && e.code;
    if (c === "conflict") { adminMsg("Sayfa başka bir kayıtla güncellendi, yenileniyor."); }
    else if (c === "not_writer" || c === "not_granted" || c === "not_declared" || c === "capability_disabled") { adminMsg("Bu görünümde kaydetme yetkin yok."); }
    else if (c === "rate_limited") { adminMsg("Çok sık kaydedildi, biraz bekleyip tekrar dene."); }
    else { adminMsg("Kaydedilemedi, tekrar dene."); }
  });
}

document.addEventListener("click", function (e) {
  var t = e.target.closest("button");
  if (!t) { if (e.target === $("sheetBack")) { $("sheetBack").hidden = true; } return; }
  if (t.dataset.add) { change(t.dataset.add, 1); return; }
  if (t.dataset.inc) { change(t.dataset.inc, 1); return; }
  if (t.dataset.dec) { change(t.dataset.dec, -1); return; }
  if (t.dataset.cat) { var el = $("sec-" + t.dataset.cat); if (el) { el.scrollIntoView({ behavior: "smooth", block: "start" }); } return; }
  if (t.id === "openSheet" || t.id === "openSheet2") { $("sheetBack").hidden = false; return; }
  if (t.id === "openBag") { if (totals().n) { $("sheetBack").hidden = false; } else { var m = $("menu"); if (m) { m.scrollIntoView({ behavior: "smooth" }); } } return; }
  if (t.id === "closeSheet") { $("sheetBack").hidden = true; return; }
  if (t.id === "clear") { Object.keys(cart).forEach(function (k) { delete cart[k]; badge(k); }); renderCart(); return; }
  if (t.id === "editStart") { startEdit(); return; }
  if (t.id === "editCancel") { cancelEdit(); return; }
  if (t.id === "editSave") { saveEdit(); return; }
});
document.addEventListener("input", function (e) {
  if (e.target.id === "addr") { $("waOrder").href = waBase() + "?text=" + encodeURIComponent(orderText()); }
});
document.addEventListener("keydown", function (e) { if (e.key === "Escape") { $("sheetBack").hidden = true; } });

function syncChips() {
  var cur = GROUPS[0].id;
  GROUPS.forEach(function (g) { var el = $("sec-" + g.id); if (el && el.getBoundingClientRect().top < 140) { cur = g.id; } });
  document.querySelectorAll(".chip").forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.cat === cur)); });
}
window.addEventListener("scroll", syncChips, { passive: true });

$("root").innerHTML = SHELL;
renderCats();
renderMenu();
renderContacts();
renderCart();
renderAdmin();

try {
  if (window.claude && window.claude.use) {
    window.claude.use("user").then(function (u) { return u ? u.canEdit() : false; }).then(function (ok) {
      canEdit = !!ok;
      renderAdmin();
    }).catch(function () {});
  }
} catch (err) {}
</script></body></html>
