.feats svg { width: 1.05rem; height: 1.05rem; stroke-width: 1.8; }
.pc .ds { display: block; margin: 0; padding-inline: 0.2rem; font-size: 0.78rem; line-height: 1.3; }
.pr small { font-size: 0.72rem; font-weight: 600; color: var(--muted); letter-spacing: 0.02em; }
.alt { margin: -0.1rem 0.2rem 0.4rem; font-size: 0.72rem; color: var(--muted); line-height: 1.3; }
.edp.ed3 { gap: 0.3rem; padding: 0 0.5rem; margin-bottom: 0.3rem; justify-content: space-between; }
.edp.ed3 span { font-size: 0.75rem; color: var(--muted); }
.edp.ed3 input { width: 4rem; }
.pk-desc { margin: 0.6rem 0 0; color: var(--muted); font-size: 0.92rem; }
.pk-h { margin: 1rem 0 0.5rem; font-weight: 600; font-size: 0.95rem; display: flex; align-items: center; gap: 0.5rem; }
.pk-h em { font-style: normal; font-size: 0.72rem; font-weight: 700; color: #1a0d00; background: var(--gold); border-radius: 99px; padding: 0.05rem 0.55rem; }
.pk-opts { display: grid; gap: 0.5rem; }
.pk-opt { display: flex; justify-content: space-between; align-items: center; gap: 0.8rem; min-height: 3.4rem; padding: 0.5rem 1rem; border: 1px solid var(--line); border-radius: 14px; background: var(--ink); color: var(--paper); text-align: left; }
.pk-opt.on, .pk-dr.on { border-color: var(--gold); box-shadow: inset 0 0 0 1px var(--gold); background: #241518; }
.pk-n { font-weight: 600; font-size: 1.02rem; display: flex; flex-direction: column; }
.pk-n small { color: var(--gold); font-weight: 500; font-size: 0.75rem; }
.pk-p { font-weight: 700; font-size: 1.15rem; color: var(--gold); white-space: nowrap; }
.pk-drinks { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.5rem; }
.pk-dr { display: flex; flex-direction: column; align-items: center; gap: 0.3rem; padding: 0.4rem 0.25rem 0.5rem; border: 1px solid var(--line); border-radius: 14px; background: var(--ink); color: var(--paper); font-size: 0.85rem; min-width: 0; }
.pk-dr img { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; object-position: 50% 40%; border-radius: 10px; }
.pk-dr.on { font-weight: 600; }
.btn.cta { background: var(--red); border-color: var(--red); color: #fff; }
#pickAdd { margin-top: 0.2rem; }
.fee { display: flex; justify-content: space-between; margin-top: 0.7rem; color: var(--muted); }
.field input, .field select { background: var(--ink); border: 1px solid var(--line); border-radius: 12px; padding: 0.65rem 0.75rem; min-height: 2.9rem; width: 100%; font-size: 1rem; }
.field textarea { font-size: 1rem; }
.field .bad { border-color: var(--red-hot); }
.field label span { opacity: 0.7; }
.zone-note { margin: -0.4rem 0 0.9rem; font-size: 0.85rem; color: var(--muted); }
.zone-note.warn { color: #ff8a80; }
.lines .ln small.dr { color: var(--paper); font-weight: 600; }
.alt { display: flex; flex-wrap: wrap; gap: 0 0.7rem; }
.alt span { white-space: nowrap; }

/* ---- v3: tek boy menü, gruplanmış sepet, içindekiler ---- */
.pc .ds, .alt { display: none; }
.dt { margin: 0 0.2rem; }
.dt summary { list-style: none; cursor: pointer; color: var(--muted); font-size: 0.78rem; padding: 0.3rem 0; min-height: 1.9rem; display: flex; align-items: center; }
.dt summary::-webkit-details-marker { display: none; }
.dt summary::after { content: "›"; margin-left: 0.3rem; font-size: 1.05rem; line-height: 1; transition: transform 0.15s; }
.dt[open] summary::after { transform: rotate(90deg); }
.dt p { margin: 0 0 0.3rem; color: var(--muted); font-size: 0.8rem; line-height: 1.35; }
.pr small { display: none; }
.pk-inc { margin: 0.5rem 0 0; color: var(--muted); font-size: 0.9rem; }
.pk-inc b { color: var(--gold); font-size: 1.15rem; }
.pk-h em.free { background: transparent; color: var(--gold); border: 1px solid var(--gold); }
.lines li.grp { display: block; }
.gh { display: flex; justify-content: space-between; align-items: flex-start; gap: 0.7rem; }
.gh .t { font-variant-numeric: tabular-nums; white-space: nowrap; font-weight: 600; }
.lines .ln b { color: var(--gold); margin-right: 0.15rem; }
.sub { list-style: none; margin: 0.5rem 0 0; padding: 0; display: grid; gap: 0.4rem; }
.lines .sub li { display: flex; justify-content: space-between; align-items: center; gap: 0.7rem; padding: 0.3rem 0.5rem 0.3rem 0.8rem; background: var(--ink); border-radius: 12px; border-bottom: 0; }
.sub .dn { font-size: 0.92rem; }
.zone-info { margin: 0.9rem 0 0.7rem; color: var(--gold); font-size: 0.9rem; font-weight: 500; }
</style>

        g.rows.map(function (r) { return '<li><span class="dn">İçecek: ' + ITEM[r.d].name + '</span>' + stepper(r.k, ITEM[r.d].name) + '</li>'; }).join("") + '</ul></li>';
    }
    return '<li class="plain"><span class="ln">' + ITEM[g.id].name + (g.type === "drink" ? '<small class="dr">Ayrı içecek</small>' : "") + '</span>' + stepper(g.k, ITEM[g.id].name) + '<span class="t">' + tl(g.q * priceOf(g.k)) + '</span></li>';
  }).join("");
}

function renderCart() {
  var s = totals(), z = zoneInfo();
  $("bar").hidden = editing || s.n === 0;
  $("barCount").textContent = "Sepetim · " + s.n + " ürün";
  $("barTotal").textContent = tl(s.t);
  $("bagN").textContent = s.n; $("bagN").hidden = s.n === 0;
  $("sheetTotal").textContent = tl(grand());
  $("totLabel").textContent = z && z.feeSet ? "Genel toplam" : "Toplam";
  $("feeRow").hidden = !(z && z.feeSet); $("feeVal").textContent = z && z.feeSet ? tl(z.fee) : "";
  var note = $("zoneNote"), msg = "", warn = false;
  if (z && z.none) { msg = DELIVERY.mesaj_disi || "Seçtiğiniz bölge teslimat alanımızda görünmüyor."; warn = true; }
  else if (z) {
    var b = [];
    if (z.feeSet) { b.push("Teslimat ücreti: " + tl(z.fee)); }
    if (z.minSet) { b.push("Minimum sipariş tutarı: " + tl(z.min)); }
    if (z.sure) { b.push("Tahmini teslimat süresi: " + z.sure); }
    msg = b.join(" · ");
  }
  note.textContent = msg; note.className = "zone-note" + (warn ? " warn" : ""); note.hidden = !msg;
  $("lines").innerHTML = linesHtml();
  syncWa();
  saveState();
  if (s.n === 0) { $("sheetBack").hidden = true; }
}

function refreshBadges() {
  document.querySelectorAll("[data-add],[data-pick]").forEach(function (b) {
    var id = b.getAttribute("data-add") || b.getAttribute("data-pick"), q = qtyFor(parts(id).id), old = b.querySelector(".q");
    if (old) { old.remove(); }
    b.classList.toggle("on", q > 0);
    if (q) { var sp = document.createElement("span"); sp.className = "q"; sp.textContent = q; b.appendChild(sp); }
  });
}

function change(k, d) {
  if (d > 0 && (cart[k] || 0) >= 99) { return; }
  cart[k] = (cart[k] || 0) + d;
  if (cart[k] <= 0) { delete cart[k]; }
  refreshBadges();
  renderCart();
}

/* Sayfa yenilenince sepet ve form bilgileri korunur (bu cihazda saklanır) */
var FORM_IDS = ["cName", "cPhone", "cZone", "addr", "cMap", "cNote"];
function saveState() {
  try {
    var f = {};
    FORM_IDS.forEach(function (id) { f[id] = $(id) ? $(id).value : ""; });
    var pm = document.querySelector('input[name="pay"]:checked'); f.pay = pm ? pm.value : "";
    localStorage.setItem(STORE_KEY, JSON.stringify({ cart: cart, form: f }));
  } catch (e) {}
}
function loadState() {
  try {
    var d = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
    if (!d || typeof d !== "object") { return; }
    var c = d.cart && typeof d.cart === "object" ? d.cart : {};
    Object.keys(c).forEach(function (k) {
      var p = k.split("|"), q = c[k];
      if (!Object.prototype.hasOwnProperty.call(ITEM, p[0])) { return; }
      if (typeof q !== "number" || q !== Math.floor(q) || q < 1 || q > 99) { return; }
      if (ITEM[p[0]].kind === "burger" ? (p.length !== 2 || MENU_DRINKS.indexOf(p[1]) < 0) : p.length !== 1) { return; }
      cart[k] = q;
    });
    var f = d.form && typeof d.form === "object" ? d.form : {};
    FORM_IDS.forEach(function (id) { if ($(id) && typeof f[id] === "string") { $(id).value = f[id].slice(0, 600); } });
    if (typeof f.pay === "string") {
      document.querySelectorAll('input[name="pay"]').forEach(function (r) { r.checked = r.value === f.pay; });
    }
  } catch (e) {}
}

function renderZones() {
  var on = DELIVERY.aktif !== false;
  $("zoneField").hidden = !on;
  var info = $("zoneInfo"); info.textContent = DELIVERY.bilgi || ""; info.hidden = !DELIVERY.bilgi;
  var cur = $("cZone").value;
  var h = '<option value="">Mahalle / bölge seçin</option>';
  (DELIVERY.bolgeler || []).forEach(function (z) { if (z.aktif !== false) { h += '<option value="' + esc(z.ad) + '">' + esc(z.ad) + '</option>'; } });
  h += '<option value="__none">Listede yok</option>';
  $("cZone").innerHTML = h;
  if (cur) { $("cZone").value = cur; }
}
function loadDelivery() {
  if (!window.fetch) { return; }
  fetch("delivery.json", { cache: "no-cache" }).then(function (r) { if (!r.ok) { throw 0; } return r.json(); }).then(function (d) {
    if (d && Array.isArray(d.bolgeler)) { DELIVERY = d; renderZones(); renderCart(); }
  }).catch(function () {});
}

function renderContacts() {
  $("phoneShow").textContent = fmtPhone(STATE.phone);
}

/* Yönetici: fiyat düzenleme */
function renderAdmin() {
  var box = $("adminIn");
  if (!editing) {
    box.innerHTML = '<p>Yönetici görünümü. Fiyatları ve WhatsApp numarasını buradan değiştirebilirsin.</p><button type="button" class="sm" id="editStart">Fiyatları düzenle</button>';
  } else {
    box.innerHTML = '<p>Fiyatları düzenliyorsun. Kutulara yeni fiyatları yaz, sonra Kaydet\'e bas.</p>' +
      '<div class="row"><label for="phEdit">WhatsApp numarası</label><input type="text" id="phEdit" inputmode="tel" value="' + fmtPhone(STATE.phone) + '"></div>' +
      '<div class="row"><button type="button" class="sm solid" id="editSave">Kaydet</button><button type="button" class="sm" id="editCancel">Vazgeç</button></div>' +
      '<p class="msg" id="adminMsg" aria-live="polite"></p>';
  }
  $("admin").hidden = !canEdit;
}

function adminMsg(t) { var m = $("adminMsg"); if (m) { m.textContent = t; } }

function startEdit() { editing = true; $("sheetBack").hidden = true; renderAdmin(); renderMenu(); renderCart(); }
function cancelEdit() { editing = false; renderAdmin(); renderMenu(); renderCart(); }

function safeJSON(o) { return JSON.stringify(o).replace(/</g, "\\u003c"); }

function buildDoc(state) {
  var reset = FALLBACK_RESET;
  var heads = document.head ? document.head.querySelectorAll("style") : [];
  for (var i = 0; i < heads.length; i++) { if (heads[i].textContent.indexOf("color-scheme") > -1) { reset = heads[i].textContent; break; } }
  var css = $("css").textContent;
  var app = $("app").textContent.replace(/^var STATE = [\s\S]*?;\n\/\*@@END_STATE\*\//, function () {
    return "var STATE = " + safeJSON(state) + ";\n/*@@END_STATE*/";
  });
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + reset + '</style></head><body>' +
    TITLE_HTML + '<style id="css">' + css + '</style><div id="root"></div><script id="app">' + app + '<\/script></body></html>';
}

function saveEdit() {
  var np = JSON.parse(JSON.stringify(STATE.p));
  var bad = false;
  document.querySelectorAll("[data-p]").forEach(function (inp) {
    var v = parseInt(inp.value, 10);
    var ok = !isNaN(v) && v >= 0 && v < 100000;
    inp.classList.toggle("bad", !ok);
    if (!ok) { bad = true; return; }
    var s = inp.getAttribute("data-p").split("|");
    if (s.length > 1) { np[s[0]][+s[1]] = v; } else { np[s[0]] = v; }
  });
  if (bad) { adminMsg("Kırmızı kutulara 0 veya daha büyük bir tam sayı yaz."); return; }
  var phone = normPhone($("phEdit").value);
  if (!phone) { adminMsg("WhatsApp numarasını 0553 903 54 04 biçiminde yaz."); return; }
  var html = buildDoc({ phone: phone, p: np });
  adminMsg("Kaydediliyor…");
  var use = window.claude && window.claude.use ? window.claude.use("artifact") : Promise.resolve(null);
  use.then(function (a) {
    if (!a) { throw { code: "not_granted" }; }
    return a.publish(html);
  }).catch(function (e) {
    var c = e && e.code;
    if (c === "conflict") { adminMsg("Sayfa başka bir kayıtla güncellendi, yenileniyor."); }
    else if (c === "not_writer" || c === "not_granted" || c === "not_declared" || c === "capability_disabled") { adminMsg("Bu görünümde kaydetme yetkin yok."); }
    else if (c === "rate_limited") { adminMsg("Çok sık kaydedildi, biraz bekleyip tekrar dene."); }
    else { adminMsg("Kaydedilemedi, tekrar dene."); }
  });
}

document.addEventListener("click", function (e) {
  var t = e.target.closest("button");
  if (!t) {
    if (e.target === $("sheetBack")) { $("sheetBack").hidden = true; }
    if (e.target === $("pickBack")) { $("pickBack").hidden = true; }
    return;
  }
  if (t.dataset.pick) { openPick(t.dataset.pick); return; }
  if (t.dataset.pdrink) { pick.d = t.dataset.pdrink; renderPick(); return; }
  if (t.id === "pickAdd") { addPicked(); return; }
  if (t.id === "closePick") { $("pickBack").hidden = true; return; }
  if (t.dataset.add) { change(t.dataset.add, 1); return; }
  if (t.dataset.inc) { change(t.dataset.inc, 1); return; }
  if (t.dataset.dec) { change(t.dataset.dec, -1); return; }
  if (t.dataset.cat) { var el = $("sec-" + t.dataset.cat); if (el) { el.scrollIntoView({ behavior: "smooth", block: "start" }); } return; }
  if (t.id === "openSheet" || t.id === "openSheet2") { $("sheetBack").hidden = false; return; }
  if (t.id === "openBag") { if (totals().n) { $("sheetBack").hidden = false; } else { var m = $("menu"); if (m) { m.scrollIntoView({ behavior: "smooth" }); } } return; }
  if (t.id === "closeSheet") { $("sheetBack").hidden = true; return; }
  if (t.id === "clear") { Object.keys(cart).forEach(function (k) { delete cart[k]; }); refreshBadges(); renderCart(); return; }
  if (t.id === "editStart") { startEdit(); return; }
  if (t.id === "editCancel") { cancelEdit(); return; }
  if (t.id === "editSave") { saveEdit(); return; }
});
function syncWa() { $("waOrder").href = waBase() + "?text=" + encodeURIComponent(orderText()); }
function orderIssue() {
  var z = zoneInfo(), s = totals();
  if (!s.n) { return { msg: "Sepetiniz boş." }; }
  if (val("cName").split(/\s+/).filter(Boolean).length < 2) { return { msg: "Lütfen ad ve soyadınızı yazın.", id: "cName" }; }
  if (!phoneOk(val("cPhone"))) { return { msg: "Lütfen geçerli bir cep telefonu numarası yazın (05xx xxx xx xx).", id: "cPhone" }; }
  if (DELIVERY.aktif !== false) {
    if (!z) { return { msg: "Lütfen teslimat bölgenizi (mahalle) seçin.", id: "cZone" }; }
    if (z.none) { return { msg: DELIVERY.mesaj_disi || "Seçtiğiniz bölge teslimat alanımızda görünmüyor.", id: "cZone" }; }
  }
  if (z && z.minSet && s.t < z.min) { return { msg: "Minimum sipariş tutarı " + tl(z.min) + ". Sepetinize ürün ekleyebilirsiniz.", id: DELIVERY.aktif !== false ? "cZone" : "" }; }
  if (val("addr").length < 6) { return { msg: "Lütfen teslimat adresinizi yazın.", id: "addr" }; }
  if (!mapOk(val("cMap"))) { return { msg: "Konum bağlantısı https:// ile başlayan bir bağlantı olmalı. İsterseniz boş bırakabilirsiniz.", id: "cMap" }; }
  if (!document.querySelector('input[name="pay"]:checked')) { return { msg: "Lütfen ödeme yöntemini seçin." }; }
  return null;
}
function clearErr() {
  $("orderErr").textContent = "";
  document.querySelectorAll(".field .bad").forEach(function (el) { el.classList.remove("bad"); });
}
document.addEventListener("input", function (e) {
  if (FORM_IDS.indexOf(e.target.id) > -1 || e.target.name === "pay") { renderCart(); clearErr(); }
});
document.addEventListener("change", function (e) {
  if (FORM_IDS.indexOf(e.target.id) > -1 || e.target.name === "pay") { renderCart(); clearErr(); }
});
document.addEventListener("keydown", function (e) { if (e.key === "Escape") { $("sheetBack").hidden = true; $("pickBack").hidden = true; } });

function syncChips() {
  var cur = GROUPS[0].id;
  GROUPS.forEach(function (g) { var el = $("sec-" + g.id); if (el && el.getBoundingClientRect().top < 140) { cur = g.id; } });
  document.querySelectorAll(".chip").forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.cat === cur)); });
}
window.addEventListener("scroll", syncChips, { passive: true });

$("root").innerHTML = SHELL;
renderCats();
renderMenu();
renderContacts();
renderZones();
loadState();
refreshBadges();
renderCart();
renderAdmin();
watchImgs();
loadDelivery();
$("waOrder").addEventListener("click", function (e) {
  var is = orderIssue();
  if (is) {
    e.preventDefault(); clearErr(); $("orderErr").textContent = is.msg;
    if (is.id) { var el = $(is.id); el.classList.add("bad"); el.focus(); el.scrollIntoView({ block: "center" }); }
  } else { syncWa(); clearErr(); }
});

try {
  if (window.claude && window.claude.use) {
    window.claude.use("user").then(function (u) { return u ? u.canEdit() : false; }).then(function (ok) {
      canEdit = !!ok;
      renderAdmin();
    }).catch(function () {});
  }
} catch (err) {}
</script></body></html>
